name: tests
on: [push, pull_request]
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'openpyxl>=3.1,<4' 'pandas>=2.2,<4'
      - run: python -m pip install 'openpyxl>=3.1,<4' 'pandas>=2.2,<4' 'pyyaml>=6,<7'
      - run: python -m unittest discover -s tests -v
